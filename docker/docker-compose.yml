# ============================================================
# openslips — WireGuard + Slips IDS
# Tham khảo: AIVPN/mod_wireguard/Dockerfile
#            StratosphereLinuxIPS/docker/docker-compose.yml
# ============================================================

services:

  # ----------------------------------------------------------
  # [1] WireGuard Server
  #     Image: lscr.io/linuxserver/wireguard
  #     Tự động tạo wg0.conf + keypair server khi start lần đầu
  # ----------------------------------------------------------
  wireguard:
    image: lscr.io/linuxserver/wireguard
    privileged: true
    container_name: aivpn_wireguard
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Asia/Ho_Chi_Minh
      - SERVERURL=AUTO           # đổi thành IP LAN nếu test nội bộ
      - SERVERPORT=51820
      - PEERS=1                  # số client — tăng lên khi cần
      - PEERDNS=8.8.8.8
      - INTERNAL_SUBNET=10.13.13.0/24
      - ALLOWEDIPS=0.0.0.0/0
      - LOG_CONFS=true           # in QR code ra log
    volumes:
      - ./data/wireguard:/config
      - /lib/modules:/lib/modules:ro
    ports:
      - "51820:51820/udp"
    sysctls:
      - net.ipv4.conf.all.src_valid_mark=1
    restart: unless-stopped
    networks:
      vpn_net:
        ipv4_address: 172.20.0.2

  # ----------------------------------------------------------
  # [2] tcpdump — bắt interface wg0
  #     Tham khảo: AIVPN/mod_wireguard/mod_wireguard.py
  # ----------------------------------------------------------
  tcpdump:
    image: nicolaka/netshoot
    container_name: aivpn_tcpdump
    network_mode: host
    command: >
      sh -c "
        echo 'Chờ wg0...';
        while ! ip link show wg0 > /dev/null 2>&1; do sleep 2; done;
        echo 'wg0 sẵn sàng, bắt đầu capture';
        tcpdump -n -s0 -i wg0 -U -w /data/pcap/capture_$(date +%Y%m%d_%H%M%S).pcap
      "
    volumes:
      - ./data/pcap:/data/pcap
    depends_on:
      - wireguard
    restart: unless-stopped

  # ----------------------------------------------------------
  # [3] Slips IDS — đọc pcap từ shared volume data/pcap/
  # ----------------------------------------------------------
  slips:
    build:
      context: ../../StratosphereLinuxIPS
      dockerfile: docker/light/Dockerfile
    image: slips-light
    container_name: aivpn_slips
    stdin_open: true
    tty: true
    cap_add:
      - NET_ADMIN
      - SYS_MODULE
    volumes:
      - ./data/pcap:/data/pcap
      - ./config/slips.yaml:/StratosphereLinuxIPS/config/slips.yaml
      - ./config/whitelist.conf:/StratosphereLinuxIPS/config/whitelist.conf
      - ./data/slips_output:/StratosphereLinuxIPS/output
    depends_on:
      - tcpdump
    command: /bin/bash
    networks:
      vpn_net:
        ipv4_address: 172.20.0.4

networks:
  vpn_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24